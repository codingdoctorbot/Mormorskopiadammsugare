name: release

# Push a tag like v0.1.0 → GitHub builds, tests and publishes the exe, signs a build-provenance
# attestation, and creates the release. Nothing is built or uploaded from a personal machine.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution PhotoSorter.sln -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/PhotoSorter.App -p:PublishProfile=Portable -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist/Mormorskopiadammsugare/Mormorskopiadammsugare.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Mormorskopiadammsugare.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Mormorskopiadammsugare/Mormorskopiadammsugare.exe

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          $ghArgs = @("${{ github.ref_name }}", "dist/Mormorskopiadammsugare/Mormorskopiadammsugare.exe", "dist/SHA256SUMS.txt",
                    "--title", "Mormorskopiadammsugare ${{ github.ref_name }}")
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += "--generate-notes" }
          gh release create @ghArgs
